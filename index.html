<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chinese Flashcards</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Library สำหรับอ่านไฟล์ Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body>

    <header>
        <h1>🀄 Chinese Flashcards</h1>

        <div class="controls">

            <!-- เลือกระดับ HSK -->
            <select id="hskSelect" class="hsk-select">
                <option value="">📚 เลือกระดับ HSK</option>
                <option value="HSK1">HSK 1</option>
                <option value="HSK2">HSK 2</option>
                <option value="HSK3">HSK 3</option>
                <option value="HSK4">HSK 4</option>
                <option value="HSK5">HSK 5</option>
                <option value="HSK6">HSK 6</option>
            </select>

            <!-- เปิด / ปิด Pinyin -->
            <button class="secondary" id="pinyinBtn">
                🔤 ซ่อนพินอิน
            </button>

            <!-- Dark Mode -->
            <button class="secondary" id="darkBtn">
                🌙 โหมดกลางคืน
            </button>

            <!-- สุ่มคำศัพท์ -->
            <button class="secondary" id="shuffleBtn">
                🔀 สุ่มคำศัพท์
            </button>

        </div>
    </header>


    <main>

        <!-- สถานะ -->
        <div class="status" id="status">
            เลือกระดับ HSK เพื่อเริ่มเรียน
        </div>


        <!-- Flashcard -->
        <div class="card-wrap">

            <div class="card" id="card">

                <!-- ด้านหน้า -->
                <div class="face front">

                    <div class="chinese" id="word">
                        欢迎
                    </div>

                    <div class="pinyin" id="pinyin">
                        huānyíng
                    </div>

                    <div class="hint">
                        คลิกเพื่อดูความหมาย
                    </div>

                </div>


                <!-- ด้านหลัง -->
                <div class="face back">

                    <div class="meaning" id="thai">
                        ยินดีต้อนรับ
                    </div>

                    <div class="english" id="english">
                        Welcome
                    </div>

                    <div class="hint">
                        คลิกเพื่อกลับด้านหน้า
                    </div>

                </div>

            </div>

        </div>


        <!-- ปุ่มเปลี่ยนคำศัพท์ -->
        <div class="navigation">

            <button id="prev">
                ← ก่อนหน้า
            </button>

            <div class="progress" id="progress">
                0 / 0
            </div>

            <button id="next">
                ถัดไป →
            </button>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
